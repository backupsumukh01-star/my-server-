services:
  - type: web
    name: wallet-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PROJECT_ID
        sync: false
      - key: APP_NAME
        value: TrustCard
      - key: APP_URL
        value: https://my-server-k3gn.onrender.com
      - key: APP_ICON
        value: https://my-server-k3gn.onrender.com/assets/svg/logo-trust.svg
      - key: CORS_ORIGIN
        value: https://my-server-k3gn.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: TRON_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
